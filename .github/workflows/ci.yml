name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: drivestock
          POSTGRES_PASSWORD: drivestock_dev
          POSTGRES_DB: drivestock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drivestock" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://drivestock:drivestock_dev@localhost:5432/drivestock_test
      TEST_DATABASE_URL: postgresql+psycopg://drivestock:drivestock_dev@localhost:5432/drivestock_test
      JWT_SECRET: ci-only-secret-value-that-is-at-least-32-chars
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
